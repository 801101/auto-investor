spring:
    config:
        # 로컬 비밀 설정은 application-local.yml에서 덮어씁니다.
        import: optional:classpath:application-local.yml
    application:
        # 애플리케이션 이름입니다.
        name: auto-investor
    datasource:
        # 비워 두면 시작 프로필에 따라 경로를 자동 선택합니다.
        # 직접 지정하면 이 값이 자동 경로보다 우선합니다.
        url: ${AUTO_INVESTOR_DB_URL:}

mybatis:
    # MyBatis XML Mapper 위치입니다.
    mapper-locations: classpath:mapper/**/*.xml
    configuration:
        # SQL alias를 그대로 Map key로 사용합니다.
        map-underscore-to-camel-case: false

runtime:
    # true면 스케줄러가 주문 판단을 실행합니다.
    trading-enabled: ${TRADING_ENABLED:false}
    # 내부 유지보수 배치 주기입니다. 분 단위입니다.
    internal-batch-interval-minutes: ${INTERNAL_BATCH_INTERVAL_MINUTES:5}
    # KIS 매매 배치 주기입니다. 분 단위입니다.
    kis-batch-interval-minutes: ${KIS_BATCH_INTERVAL_MINUTES:20}

investment:
    market:
        # DOMESTIC=국내, OVERSEAS=해외
        type: ${INVESTMENT_MARKET_TYPE:OVERSEAS}
        # 국내 시장 범위입니다. ALL/KOSPI/KOSDAQ
        domestic-market-code: ${INVESTMENT_DOMESTIC_MARKET_CODE:ALL}
        # 해외 주문 거래소 코드입니다.
        overseas-exchange-code: ${INVESTMENT_OVERSEAS_EXCHANGE_CODE:NASD}
        # 해외 현재가 조회 거래소 코드입니다.
        overseas-price-exchange-code: ${INVESTMENT_OVERSEAS_PRICE_EXCHANGE_CODE:NAS}
        # 해외 거래 통화입니다.
        overseas-currency-code: ${INVESTMENT_OVERSEAS_CURRENCY_CODE:USD}

    order:
        # AMOUNT=금액 기준, SHARE=주 수 기준
        unit-type: ${INVESTMENT_ORDER_UNIT_TYPE:SHARE}
        # AMOUNT 주문 기준 금액입니다.
        unit-amount: ${INVESTMENT_UNIT_AMOUNT:1.00}
        # SHARE 주문 기준 주 수입니다.
        unit-shares: ${INVESTMENT_UNIT_SHARES:1}

    holding:
        # 같은 종목 최대 보유량입니다. 0은 무제한입니다.
        max-holdings-per-stock: ${INVESTMENT_MAX_HOLDINGS_PER_STOCK:1}
        # 중복 포함 전체 보유 슬롯입니다. 0은 무제한입니다.
        max-holdings: ${INVESTMENT_MAX_HOLDINGS:50}

    candidate:
        # true면 ETF/ETP도 후보에 포함합니다.
        include-etf: ${INVESTMENT_INCLUDE_ETF:false}

    strategy:
        take-profit:
            # BLACK 전환 익절률입니다.
            rate: ${INVESTMENT_TAKE_PROFIT_RATE:0.10}
        stop-loss:
            # BLACK 전환 손절률입니다.
            rate: ${INVESTMENT_STOP_LOSS_RATE:-0.10}
        white:
            # 미변동 상태가 이 영업일을 초과하면 GRAY로 전환합니다. 0이면 즉시입니다.
            flat-grace-trading-days: ${INVESTMENT_WHITE_FLAT_GRACE_TRADING_DAYS:3}
        gray:
            # GRAY 진입 후 이 영업일을 초과하면 BLACK으로 전환합니다. 0이면 즉시입니다.
            grace-trading-days: ${INVESTMENT_GRAY_GRACE_TRADING_DAYS:3}

kis:
    # PAPER=모의투자, REAL=실전투자
    account-mode: ${KIS_ACCOUNT_MODE:PAPER}
    # KIS App Key입니다. 로컬 파일이나 환경변수로 넣습니다.
    app-key: ${KIS_APP_KEY:}
    # KIS App Secret입니다. Git에 올리지 않습니다.
    app-secret: ${KIS_APP_SECRET:}
    # KIS 계좌번호 앞 8자리입니다.
    account-number: ${KIS_ACCOUNT_NUMBER:}
    # KIS 계좌상품코드 2자리입니다.
    account-product-code: ${KIS_ACCOUNT_PRODUCT_CODE:}
